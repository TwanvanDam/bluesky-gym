run_name: null
agent_config:
  policy: MultiInputPolicy
  algorithm: SAC
  # Wider policy and Q-function heads to handle richer CNN features.
  network_arch:
    pi:
      - 512
      - 256
    qf:
      - 512
      - 256
  feature_extractor:
    # Deep spatial CNN for 64x64 input.
    # Four conv+pool blocks progressively halve spatial dims while doubling
    # channels, ending at 4x4x128 = 2048 features → projected to 256.
    # No global pooling: the agent can still localise where density peaks are.
    # Input: 2 channels (wide map + close map) x 64x64.
    cnn_layers:
      - type: conv
        in_channels: null      # auto-set to 2 (dual scale)
        kernel_size: 3
        out_channels: 32
        padding: 1
        stride: 1
      - type: ReLU
      - type: pooling
        mode: max
        kernel_size: 2
        stride: 2              # 64x64 -> 32x32
      - type: conv
        in_channels: 32
        kernel_size: 3
        out_channels: 64
        padding: 1
        stride: 1
      - type: ReLU
      - type: pooling
        mode: max
        kernel_size: 2
        stride: 2              # 32x32 -> 16x16
      - type: conv
        in_channels: 64
        kernel_size: 3
        out_channels: 128
        padding: 1
        stride: 1
      - type: ReLU
      - type: pooling
        mode: max
        kernel_size: 2
        stride: 2              # 16x16 -> 8x8
      - type: conv
        in_channels: 128
        kernel_size: 3
        out_channels: 128
        padding: 1
        stride: 1
      - type: ReLU
      - type: pooling
        mode: max
        kernel_size: 2
        stride: 2              # 8x8 -> 4x4
      - type: linear
        in_features: null      # 4*4*128=2048, flattened by the linear type
        out_features: 256
    vector_layer_sizes: null
training_config:
  batch_size: 256
  buffer_size: 1000000
  learning_rate: 0.0003
  total_timesteps: 500000
  save_frequency: 50000