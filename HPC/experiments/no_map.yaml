agent_config:
  algorithm: SAC
  feature_extractor:
    cnn_layers: null
    vector_layer_sizes:
      - in_features: null
        out_features: 32
        type: linear
      - type: ReLU
  network_arch:
    pi:
      - 256
      - 256
    qf:
      - 256
      - 256
  policy: MultiInputPolicy
  type: SB3
navigation_config:
  ac_initial_alt: 4572.0
  ac_initial_spd: 128.611111
  ac_name: KL001
  ac_type: a320
  action_time: 120
  faf_distance: 0.0
  iaf_angle: 60.0
  iaf_distance: 37.0
  max_steps: 50
  mean_episode_length: 1200.0
  normalize_distance_obs: 270000.0
  map_projection_crs: EPSG:3035
  sim_dt: 5
  constraint_violation_reward: -1.0
  successful_approach_reward: 5.0
  use_sin_cos_obs: true
  map_sampling_config:
    exclusion_zones:
     - lat: 52.308
       lon: 4.764
       radius_km: 250
    simulation_bounds_mode: degrees
    simulation_bounds_size: 5
    aircraft_position_mode: relative
    aircraft_lat_sampling:
      distribution: normal
      std: 2.0
    aircraft_lon_sampling:
      distribution: normal
      std: 2.0
    destination_hdg_sampling:
      distribution: uniform
      high: 360.0
      low: 0.0
    destination_lon_sampling:
      distribution: uniform
      low: -5
      high: 45
    destination_lat_sampling:
      distribution: uniform
      low: 35
      high: 55
training_config:
  batch_size: 256
  buffer_size: 1000000
  learning_rate: 0.0003
  save_frequency: 100000
  total_timesteps: 1000000
