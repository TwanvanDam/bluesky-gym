    conv:
      in_channels: null
      kernel_size: 3
      out_channels: 16
      padding: 1
      stride: 2
    pooling:
      stride: 2
      kernel_size: 2
      type: max
      padding: 0
  - activation: ReLU
    conv:
      in_channels: 16
      kernel_size: 3
      out_channels: 32
      padding: 1
      stride: 1
    pooling:
      stride: 2
      kernel_size: 2
      type: max
      padding: 0
