agent_config:
  algorithm: SAC
  batch_size: 512
  buffer_size: 1000000
  feature_extractor:
    cnn_layers:
    - in_channels: null
      kernel_size: 3
      out_channels: 32
      padding: 1
      stride: 1
      type: conv
    - type: ReLU
    - kernel_size: 2
      mode: max
      padding: 0
      stride: 2
      type: pooling
    - in_channels: 32
      kernel_size: 3
      out_channels: 64
      padding: 1
      stride: 1
      type: conv
    - type: ReLU
    - kernel_size: 2
      mode: max
      padding: 0
      stride: 2
      type: pooling
    - in_channels: 64
      kernel_size: 3
      out_channels: 64
      padding: 1
      stride: 1
      type: conv
    - type: ReLU
    - kernel_size: 2
      mode: max
      padding: 0
      stride: 2
      type: pooling
    vector_layer_sizes:
    - in_features: null
      out_features: 32
      type: linear
    - type: ReLU
  gamma: 0.99
  gradient_steps: -1
  learning_rate: 0.0001
  learning_starts: 50000
  network_arch:
    pi:
    - 256
    - 256
    qf:
    - 256
    - 256
  policy: MultiInputPolicy
  tau: 0.005
  type: SB3
navigation_config:
  ac_initial_alt: 4572.0
  ac_initial_spd: 128.611111
  ac_name: KL001
  ac_type: a320
  action_time: 120
  clip_reward_max: null
  clip_reward_min: null
  constraint_violation_reward: -1.0
  faf_distance: 0.0
  iaf_angle: 60.0
  iaf_distance: 37.0
  map_projection_crs: EPSG:3035
  map_sampling_config:
    aircraft_lat_sampling:
      distribution: normal
      mean: 0
      std: 2.0
    aircraft_lon_sampling:
      distribution: normal
      mean: 0
      std: 2.0
    aircraft_position_mode: relative
    destination_hdg_sampling:
      distribution: uniform
      high: 360.0
      low: 0.0
    destination_lat_sampling:
      distribution: uniform
      high: 55.0
      low: 35.0
    destination_lon_sampling:
      distribution: uniform
      high: 45.0
      low: -5.0
    exclusion_zones:
    - lat: 52.308
      lon: 4.764
      radius_km: 250.0
    simulation_bounds_mode: meters
    simulation_bounds_size: 400000.0
  max_action_degrees: 90.0
  max_steps: 50
  mean_episode_length: 1400.0
  normalize_distance_obs: 270000.0
  sim_dt: 5
  successful_approach_reward: 5.0
  use_sin_cos_obs: true
population_config:
  clip_noise_reward: false
  fuel_weight: 0.5
  map_observation_configs:
  - position: centered
    range:
    - 64000.0
    - 64000.0
    shape:
    - 16
    - 16
  map_source_config:
    file_path: scripts/population_maps/europe_3035_1km.tif
    source_unit: people_per_pixel
    spatial_transforms: []
    type: transformed
    value_transforms:
      - type: gamma_correction
        gamma:
          - 0.520
          - 0.700
        target_value: 46.3
        percentile: 50
        p: 0.5
      - type: clip
        percentile: 99.9
    window_margin_m: 0
  noise_model_config:
    base_distance: 304.8
    noise_base_dba: 85.0
    noise_cutoff_dba: 55.0
    noise_resolution_m: 1000.0
    w_0: 1.0e-12
  observation_normalization: log
  resampling: average
training_config:
  n_envs: 4
  save_frequency: 50000
  save_replay_buffer: false
  total_timesteps: 1000000