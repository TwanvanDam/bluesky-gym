agent_config:
  algorithm: SAC
  learning_starts: 50000
  batch_size: 512
  learning_rate: 1.0E-4
  feature_extractor:
    cnn_layers:
      - in_channels: null
        kernel_size: 3
        out_channels: 32
        padding: 1
        stride: 1
        type: conv
      - type: ReLU
      - kernel_size: 2
        mode: max
        padding: 0
        stride: 2
        type: pooling
      - in_channels: 32
        kernel_size: 3
        out_channels: 64
        padding: 1
        stride: 1
        type: conv
      - type: ReLU
      - kernel_size: 2
        mode: max
        padding: 0
        stride: 2
        type: pooling
      - in_channels: 64
        kernel_size: 3
        out_channels: 64
        padding: 1
        stride: 1
        type: conv
      - type: ReLU
      - kernel_size: 2
        mode: max
        padding: 0
        stride: 2
        type: pooling
    vector_layer_sizes:
      - in_features: null
        out_features: 32
        type: linear
      - type: ReLU
  network_arch:
    pi:
      - 256
      - 256
    qf:
      - 256
      - 256
  policy: MultiInputPolicy
  type: SB3
navigation_config:
  max_action_degrees: 90
  ac_initial_alt: 4572.0
  ac_initial_spd: 128.611111
  ac_name: KL001
  ac_type: a320
  action_time: 120
  faf_distance: 0.0
  iaf_angle: 60.0
  iaf_distance: 37.0
  max_steps: 50
  mean_episode_length: 1200.0
  normalize_distance_obs: 270000.0
  map_projection_crs: EPSG:3035
  sim_dt: 5
  constraint_violation_reward: -1.0
  successful_approach_reward: 5.0
  use_sin_cos_obs: true
  map_sampling_config:
    exclusion_zones:
     - lat: 52.308
       lon: 4.764
       radius_km: 250
    simulation_bounds_mode: degrees
    simulation_bounds_size: 5
    aircraft_position_mode: relative
    aircraft_lat_sampling:
      distribution: normal
      std: 2.0
    aircraft_lon_sampling:
      distribution: normal
      std: 2.0
    destination_hdg_sampling:
      distribution: uniform
      high: 360.0
      low: 0.0
    destination_lon_sampling:
      distribution: uniform
      low: -5
      high: 45
    destination_lat_sampling:
      distribution: uniform
      low: 35
      high: 55
population_config:
  normalization_percentile: 99.9
  clip_noise_reward: true
  fuel_weight: 0.5
  map_source_config:
    file_path: scripts/population_maps/europe_3035_1km.tif
    source_unit: people_per_pixel
    type: tiff
  noise_model_config:
    base_distance: 304.8
    noise_base_dba: 85.0
    noise_cutoff_dba: 55.0
    noise_resolution_m: 1000.0
    w_0: 1.0e-12
  observation_normalization: log
  map_observation_configs:
    - range:
        - 256000
        - 256000
      shape:
        - 16
        - 16
      position: forward
  resampling: cubic_spline
training_config:
  n_envs: 4
  save_frequency: 12500
  total_timesteps: 1000000