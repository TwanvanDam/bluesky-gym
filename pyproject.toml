[project]
name = "bluesky-gym"
dynamic = ["version"]
dependencies = [
    "pygame",
    "gymnasium[other]>=1.2.3",
    "stable-baselines3>=2.7",
    "numpy>=2.4.3",
    "bluesky-simulator>=1.0.7",
    "rasterio",
    "pyproj",
    "shapely",
    "gstools",
    "pydantic",
    "tqdm>=4.67.3",
    "tensorboard",
    "gstools-core",
]

authors = [
  { name="Jan Groot", email="d.j.groot@tudelft.nl" },
  { name="Joost Ellerbroek", email="j.ellerbroek@tudelft.nl" },
  { name="Giulia Leto", email="g.leto@tudelft.nl" },
  { name="Sasha Vlaskin", email="a.vlaskin@tudelft.nl" },
]
description = "A gymnasium style environment for standardized Reinforcement Learning research in Air Traffic Management."
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Development Status :: 4 - Beta",

    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
]

[project.optional-dependencies]
cu130 = ["torch==2.10.0+cu130" ]
cu121 = ["torch==2.3.1+cu121"]

[tool.uv]
conflicts = [
    [
        { extra = "cu121" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" , extra = "cu121"},
    { index = "pytorch-cu130" , extra = "cu130"},
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[project.urls]
Homepage = "https://github.com/TUDelft-CNS-ATM/bluesky-gym"
Issues = "https://github.com/TUDelft-CNS-ATM/bluesky-gym/issues"

[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
  "bluesky_gym/*",
]
